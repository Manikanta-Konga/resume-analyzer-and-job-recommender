<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resume & Job Matcher</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg: #F3F4F6;
            --card-bg: #FFFFFF;
            --text-main: #1F2937;
            --text-muted: #6B7280;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body { background-color: var(--bg); color: var(--text-main); line-height: 1.6; padding: 40px 20px; }

        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { font-size: 2.5rem; font-weight: 800; color: var(--primary); letter-spacing: -0.05em; }
        .header p { color: var(--text-muted); font-size: 1.1rem; margin-top: 10px; }

        .container { max-width: 800px; margin: 0 auto; }

        /* Upload Card */
        .upload-card { background: var(--card-bg); padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: center; border: 1px solid #E5E7EB; }
        .file-input-wrapper { margin: 20px 0; }
        input[type="file"] { font-size: 1rem; padding: 10px; border: 2px dashed #D1D5DB; border-radius: 8px; width: 100%; cursor: pointer; background: #F9FAFB; }

        button { background-color: var(--primary); color: white; border: none; padding: 14px 28px; font-size: 1.1rem; font-weight: 600; border-radius: 8px; cursor: pointer; transition: background 0.2s, transform 0.1s; width: 100%; max-width: 300px; }
        button:hover { background-color: var(--primary-hover); transform: translateY(-2px); }
        button:disabled { background-color: #9CA3AF; cursor: not-allowed; transform: none; }

        /* Loader */
        .loader { display: none; border: 4px solid #F3F4F6; border-top: 4px solid var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Results Section */
        .results-section { display: none; margin-top: 40px; animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Stats Grid */
        .stats-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--card-bg); padding: 25px; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #E5E7EB; }

        .score-circle { font-size: 3rem; font-weight: 800; color: var(--primary); text-align: center; }
        .score-label { text-align: center; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; font-size: 0.8rem; }

        .skills-container { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 15px; }
        .skill-pill { background: #EEF2FF; color: var(--primary); padding: 6px 14px; border-radius: 20px; font-size: 0.9rem; font-weight: 600; }

        /* Job Cards */
        .jobs-header { margin-bottom: 20px; font-size: 1.5rem; font-weight: 800; border-bottom: 2px solid #E5E7EB; padding-bottom: 10px; }
        .job-card { background: var(--card-bg); padding: 20px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #E5E7EB; transition: box-shadow 0.2s, border-color 0.2s; display: flex; flex-direction: column; text-decoration: none; color: inherit; }
        .job-card:hover { box-shadow: 0 10px 15px rgba(0,0,0,0.05); border-color: var(--primary); }
        .job-title { font-size: 1.2rem; font-weight: 800; color: var(--primary); margin-bottom: 5px; }
        .job-company { font-weight: 600; color: var(--text-main); margin-bottom: 8px; }
        .job-details { color: var(--text-muted); font-size: 0.9rem; display: flex; gap: 15px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>AI Resume Analyzer</h1>
        <p>Upload your resume to instantly calculate your ATS score and find matching jobs.</p>
    </div>

    <div class="upload-card">
        <form id="uploadForm">
            <div class="file-input-wrapper">
                <input type="file" id="fileInput" name="file" accept=".pdf,.doc,.docx" required>
            </div>
            <button type="submit" id="submitBtn">Analyze My Resume</button>
        </form>
        <div class="loader" id="loader"></div>
        <p id="loadingText" style="display: none; color: var(--text-muted); margin-top: 10px;">Extracting skills and matching jobs...</p>
    </div>

    <div class="results-section" id="resultsBox">

        <div class="stats-grid">
            <div class="stat-card">
                <div class="score-label">ATS Match Score</div>
                <div class="score-circle"><span id="atsScore">0</span></div>
            </div>
            <div class="stat-card">
                <div class="score-label" style="text-align: left;">Detected Core Skills</div>
                <div class="skills-container" id="skillsContainer">
                </div>
            </div>
        </div>

        <h2 class="jobs-header">Live Job Matches</h2>
        <div id="jobsContainer">
        </div>

    </div>
</div>

<script>
    document.getElementById('uploadForm').addEventListener('submit', async function(event) {
        event.preventDefault();

        const fileInput = document.getElementById('fileInput');
        const submitBtn = document.getElementById('submitBtn');
        const loader = document.getElementById('loader');
        const loadingText = document.getElementById('loadingText');
        const resultsBox = document.getElementById('resultsBox');

        // UI Loading State
        submitBtn.style.display = 'none';
        loader.style.display = 'block';
        loadingText.style.display = 'block';
        resultsBox.style.display = 'none';

        const formData = new FormData();
        formData.append("file", fileInput.files[0]);

        try {
            const response = await fetch('/api/resume/analyze', {
                method: 'POST',
                body: formData
            });

            const data = await response.json();

            // 1. Set Score
            document.getElementById('atsScore').innerText = data.ats_score;

            // 2. Format Skills as Pills
            const skillsArray = data.skills_detected.split(',');
            const skillsHtml = skillsArray.map(skill => `<span class="skill-pill">${skill.trim()}</span>`).join('');
            document.getElementById('skillsContainer').innerHTML = skillsHtml;

            // 3. Format Adzuna Jobs as Cards
            const adzunaData = JSON.parse(data.job_recommendations);
            const jobsList = adzunaData.results;
            let jobsHtml = "";

            if (jobsList && jobsList.length > 0) {
                for (let i = 0; i < Math.min(10, jobsList.length); i++) {
                    let job = jobsList[i];
                    // Clean up Adzuna's HTML bold tags in descriptions
                    let cleanDesc = job.description.replace(/<strong>/g, "").replace(/<\/strong>/g, "");

                    jobsHtml += `
                        <a href="${job.redirect_url}" target="_blank" class="job-card">
                            <div class="job-title">${job.title}</div>
                            <div class="job-company">🏢 ${job.company.display_name}</div>
                            <div class="job-details">
                                <span>📍 ${job.location.display_name}</span>
                                <span>💰 ${job.salary_min ? '$' + Math.floor(job.salary_min).toLocaleString() + '+' : 'Salary Private'}</span>
                            </div>
                            <p style="margin-top: 10px; font-size: 0.9rem; color: #6B7280;">${cleanDesc.substring(0, 150)}...</p>
                        </a>
                    `;
                }
            } else {
                jobsHtml = `<div class="job-card"><div class="job-company">No immediate job matches found. Try adding more skills to your resume!</div></div>`;
            }

            document.getElementById('jobsContainer').innerHTML = jobsHtml;

            // Show Results
            resultsBox.style.display = 'block';

        } catch (error) {
            console.error(error);
            alert("Connection error! Make sure your backend is running.");
        } finally {
            // Reset UI State
            submitBtn.style.display = 'inline-block';
            loader.style.display = 'none';
            loadingText.style.display = 'none';
        }
    });
</script>

</body>
</html>
